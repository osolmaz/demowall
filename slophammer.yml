typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - src
    exclude:
      - "**/*.test.ts"
      - "tests/**"
      - "dist/**"
      - "coverage/**"
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - src/demowall/grid.ts
  dependency_boundaries:
    - from: src/cli
      allow:
        - src/common
        - src/demowall
    - from: src/demowall
      allow:
        - src/common
        - src/demowall
